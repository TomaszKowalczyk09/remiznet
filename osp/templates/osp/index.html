{% extends 'osp/base.html' %}
{% block title %}Jednostki{% endblock %}
{% block content %}
<h2>Jednostki</h2>
<ul>
  {% for unit in units %}
    <li>{{ unit.name }} - <a href="/osp/units/{{ unit.pk }}/requests/new/">Nowy wniosek</a> | <a href="/osp/units/{{ unit.pk }}/firefighters/add/">Dodaj strażaka</a> | <a href="/osp/units/{{ unit.pk }}/firefighters/">Lista strażaków</a></li>
  {% empty %}
    <li>Brak jednostek</li>
  {% endfor %}
</ul>
{% endblock %}
