{% if page_obj.paginator.num_pages > 1 %}
<div class="wp-pagination">
  {% if page_obj.has_previous %}
    <a class="wp-btn" href="{% querystring page=page_obj.previous_page_number %}">← Poprzednia</a>
  {% endif %}
  <span>Strona {{ page_obj.number }} z {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="wp-btn" href="{% querystring page=page_obj.next_page_number %}">Następna →</a>
  {% endif %}
</div>
{% endif %}
