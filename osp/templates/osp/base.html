<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OSP - {% block title %}{% endblock %}</title>
</head>
<body>
  <header>
    <h1>OSP Management</h1>
    <nav>
      <a href="/osp/">Home</a> |
      <a href="/osp/panel/">Panel</a> |
      {% if user.is_authenticated %}
        <span>Logged in as {{ user.username }}</span> |
        <a href="{% url 'osp:logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'osp:login' %}">Login</a>
      {% endif %}
    </nav>
    <hr/>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
