{% extends 'osp/base.html' %}
{% block title %}Wnioski{% endblock %}
{% block content %}
  <h2>Wnioski</h2>
  <ul>
    {% for r in requests %}
      <li><a href="{% url 'osp:request_detail' r.pk %}">{{ r.title }}</a> - {{ r.unit }} - {{ r.get_status_display }}</li>
    {% empty %}
      <li>Brak wniosków</li>
    {% endfor %}
  </ul>
{% endblock %}
